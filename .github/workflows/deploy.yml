name: Build and deploy

# The site is published in two editions from this repository: the live tool,
# from main, at the root of the site, and the edition described in the doctoral
# thesis, from the thesis branch, at /thesis/. GitHub Pages replaces the whole
# site on each deploy, so each deploy builds both. The site is deployed only
# when a version tag (v1.2.0, ...) is pushed: the live edition is built from the
# tagged commit and the thesis edition from the head of the thesis branch.
# Pushes to main or thesis, including edits from the admin panel, are not
# published until the next tag. Run the workflow by hand to deploy the head of
# main. Make the tag with `npm run release`, which also writes the changelog;
# once the site is deployed, the release job publishes a GitHub release with
# the notes of that version. Keep this file the same on both branches.

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # A pull request is built on its own, to check it. Pushes to a branch are no
  # longer checked here, so open a pull request, or tag, to run the checks.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # --if-present: a branch from before these scripts existed still builds.
      - run: npm run format:check --if-present
      - run: npm run check:content --if-present
      # Type check, on branches that have the checker installed.
      - run: if [ -d node_modules/@astrojs/check ]; then npm run check; fi
      - run: npm test --if-present
      - run: npm run build

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref || 'main' }}
          path: live
          # The whole history, to check below that the tag is on main.
          fetch-depth: 0
      - name: Check the tag
        if: github.ref_type == 'tag'
        working-directory: live
        run: |
          version="$(npm pkg get version | tr -d '"')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match the version $version in package.json. Make releases with npm run release."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::The tag $GITHUB_REF_NAME is not on main."
            exit 1
          fi
      - id: thesis
        name: Look for the thesis branch
        run: |
          if git -C live ls-remote --exit-code --heads origin thesis > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.thesis.outputs.exists == 'true'
        with:
          ref: thesis
          path: thesis
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '*/package-lock.json'
      - id: pages
        uses: actions/configure-pages@v5
      # The formatting and the content are checked before each build, and the
      # build fails on the content too, so a bad edit from the admin panel
      # never reaches the published site. check:content lists every problem at
      # once. The type check and the tests run here as well, since fixes are
      # pushed without a pull request.
      # A failure in either edition stops the deploy of both.
      - name: Build the live edition
        working-directory: live
        run: |
          npm ci
          npm run format:check --if-present
          npm run check:content --if-present
          if [ -d node_modules/@astrojs/check ]; then npm run check; fi
          npm test --if-present
          npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PUBLIC_REPO: ${{ github.repository }}
          PUBLIC_REPO_BRANCH: main
          PUBLIC_CMS_AUTH_URL: ${{ vars.CMS_AUTH_URL }}
          PUBLIC_EDITION: live
          PUBLIC_OTHER_EDITION_URL: ${{ steps.thesis.outputs.exists == 'true' && format('{0}/thesis/', steps.pages.outputs.base_path) || '' }}
      - name: Build the thesis edition
        if: steps.thesis.outputs.exists == 'true'
        working-directory: thesis
        run: |
          npm ci
          npm run check:content --if-present
          if [ -d node_modules/@astrojs/check ]; then npm run check; fi
          npm test --if-present
          npm run build
          mv dist ../live/dist/thesis
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/thesis
          PUBLIC_REPO: ${{ github.repository }}
          PUBLIC_REPO_BRANCH: thesis
          PUBLIC_CMS_AUTH_URL: ${{ vars.CMS_AUTH_URL }}
          PUBLIC_EDITION: thesis
          PUBLIC_OTHER_EDITION_URL: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: live/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # One deploy at a time, in order. Only this job is in the group, so a pull
    # request check never waits for a deploy or replaces one in the queue.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # After a tag is deployed, its notes from CHANGELOG.md become a GitHub release.
  release:
    if: github.ref_type == 'tag'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The lines under this version's heading, up to the next version.
          awk -v v="$version" '/^## /{ if (p) exit; if (index($0, "[" v "]") || $2 == v) { p = 1; next } } p' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "No notes for $version in CHANGELOG.md." > notes.md; fi
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
          fi
