id: P02
number: 2
origin: standards-and-literature
name: Procés de definició de necessitats i requisits de les parts interessades
purpose: >-
  El propòsit del *Procés de definició de necessitats i requisits de les parts interessades* és recollir
  i analitzar les necessitats de les parts interessades i transformar-les en un conjunt coherent de requisits
  que defineixin les interaccions previstes dins l'entorn del sistema i que serveixin de línia de base
  per validar les capacitats del sistema.
outcomes:
- id: a
  text: S'identifiquen les parts interessades i els seus rols.
- id: b
  text: Es defineixen les necessitats, els objectius i les restriccions de les parts interessades.
- id: c
  text: Es descriuen el context operacional i l'ús previst.
- id: d
  text: S'analitzen i es prioritzen els requisits.
- id: e
  text: Es defineixen les característiques de qualitat.
- id: f
  text: Es resolen els conflictes i les ambigüitats.
- id: g
  text: S'acorden formalment els requisits de les parts interessades.
- id: h
  text: >-
    S'estableix la traçabilitat entre les necessitats de les parts interessades i els futurs requisits
    del sistema.
inputs:
- workProduct: technical-problem-statement
  name: Enunciat tècnic del problema
  description: El problema, els criteris d'èxit i el concepte operacional.
  serves:
  - b
  - c
  - d
- workProduct: stakeholder-list
  name: Llista de parts interessades
  description: Una llista inicial de les parts que tenen interès en el sistema.
  serves:
