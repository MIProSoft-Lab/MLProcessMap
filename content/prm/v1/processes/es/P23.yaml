id: P23
number: 23
origin: standards-only
name: Proceso de operación
purpose: >-
  El propósito del *Proceso de operación* es usar el sistema de aprendizaje automático en producción para
  prestar sus servicios. Mantiene el sistema disponible dentro de los niveles de servicio acordados, gestiona
  las personas y los recursos necesarios para hacerlo funcionar y atiende los incidentes y las solicitudes
  de soporte que surgen durante su uso.
outcomes:
- id: a
  text: >-
    Se define una estrategia de operación y se dispone de sistemas habilitadores y de operadores cualificados.
- id: b
  text: El sistema se usa en su entorno operativo y sirve predicciones en la modalidad establecida.
- id: c
  text: Los recursos de ejecución se gestionan en función de los objetivos de coste y rendimiento.
- id: d
  text: >-
    Los datos de producción y las cargas de servicio se capturan y gobiernan para su reutilización posterior.
- id: e
  text: >-
    Se aplican los procedimientos operativos y las medidas de contingencia en condiciones degradadas.
- id: f
  text: >-
    Los incidentes y las solicitudes de soporte se registran, se siguen y se escalan cuando se necesita
    un cambio.
- id: g
  text: >-
    Se elaboran registros de operación que se trazan hasta los requisitos y las decisiones arquitectónicas.
