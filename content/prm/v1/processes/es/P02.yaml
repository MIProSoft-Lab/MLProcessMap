id: P02
number: 2
origin: standards-and-literature
name: Proceso de definición de necesidades y requisitos de las partes interesadas
purpose: >-
  El propósito del *Proceso de definición de necesidades y requisitos de las partes interesadas* es recoger
  y analizar las necesidades de las partes interesadas y transformarlas en un conjunto coherente de requisitos
  que definen las interacciones previstas en el entorno del sistema y que sirven como línea base frente
  a la que se validan las capacidades del sistema.
outcomes:
- id: a
  text: Se identifican las partes interesadas y sus roles.
- id: b
  text: Se definen las necesidades, los objetivos y las restricciones de las partes interesadas.
- id: c
  text: Se describen el contexto operativo y el uso previsto.
- id: d
  text: Se analizan y priorizan los requisitos.
- id: e
  text: Se definen las características de calidad.
- id: f
  text: Se resuelven los conflictos y las ambigüedades.
- id: g
  text: Se acuerdan formalmente los requisitos de las partes interesadas.
- id: h
  text: >-
    Se establece la trazabilidad entre las necesidades de las partes interesadas y los futuros requisitos
    del sistema.
inputs:
- workProduct: technical-problem-statement
  name: Enunciado técnico del problema
  description: El problema, los criterios de éxito y el concepto operativo.
  serves:
  - b
  - c
  - d
- workProduct: stakeholder-list
  name: Lista de partes interesadas
  description: Una lista inicial de las partes con interés en el sistema.
  serves:
