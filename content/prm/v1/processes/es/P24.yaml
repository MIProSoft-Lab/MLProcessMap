id: P24
number: 24
origin: standards-and-literature
name: Proceso de mantenimiento
purpose: >-
  El propósito del *Proceso de mantenimiento* es sostener la capacidad del sistema de aprendizaje automático
  para prestar su servicio. Analiza las desviaciones notificadas y lleva a cabo las acciones correctivas,
  adaptativas, perfectivas y preventivas necesarias, incluido el reentrenamiento, coordinando el trabajo
  a través de los procesos de datos, de modelo y de transición.
outcomes:
- id: a
  text: Se define una estrategia de mantenimiento como anexo de la documentación de la arquitectura.
- id: b
  text: >-
    Las necesidades de mantenimiento se clasifican y se atribuyen a los datos, al modelo o al código.
- id: c
  text: Se evalúa el impacto de cada cambio antes de su implementación.
- id: d
  text: >-
    Se restablece la capacidad operativa tras un fallo mediante la reversión, el respaldo o la operación
    degradada.
- id: e
  text: Se implementan los cambios, incluido el reentrenamiento o el aprendizaje continuo del modelo.
- id: f
  text: >-
    Se realizan pruebas de regresión de los cambios y se evalúan los modelos revisados frente al marco
    de evaluación original.
- id: g
  text: Se confirma la capacidad restablecida frente a los indicadores que desencadenaron el cambio.
- id: h
  text: >-
    Se establecen registros y tendencias de mantenimiento que vinculan cada acción con los elementos afectados
    y con el linaje del modelo.
