id: P08
number: 8
origin: decomposed
name: Proceso de identificación de fuentes de datos
purpose: >-
  El propósito del *Proceso de identificación de fuentes de datos* es descubrir y documentar conjuntos
  de datos candidatos procedentes de repositorios internos y externos para establecer la base del modelo
  de aprendizaje automático. Extrae las especificaciones de datos de los requisitos de datos y comprueba
  las implicaciones de licencia, legales o éticas de las fuentes de datos descubiertas antes de que se
  produzca cualquier recopilación o ingesta de datos.
outcomes:
- id: a
  text: Se identifican, evalúan y documentan las fuentes de datos pertinentes.
- id: b
  text: Se caracterizan la disponibilidad y la calidad de los conjuntos de datos internos y externos.
- id: c
  text: Se identifican las condiciones legales, éticas y de privacidad.
- id: d
  text: Se identifican las carencias de datos y las fuentes complementarias.
- id: e
  text: Se establecen las relaciones entre los requisitos de datos y las fuentes.
inputs:
- workProduct: data-requirements-specification
  name: Especificación de requisitos de datos
  description: Las necesidades de datos derivadas de los requisitos del sistema.
  serves:
  - a
  - d
  - e
- workProduct: data-landscape-assessment
  name: Evaluación del panorama de datos
  description: La evaluación preliminar de los datos disponibles para el proyecto.
  serves:
  - b
  - d
outputs:
- workProduct: data-catalog
  name: Catálogo de datos
  description: >-
    El inventario de fuentes internas y externas, con sus evaluaciones de calidad y las revisiones legales
    y éticas.
  serves:
  - a
  - b
  - c
  - d
  - e
activities:
- id: A1
  title: Analizar los requisitos de datos
  description: >-
    Traducir los requisitos del sistema en especificaciones de datos que orienten la estrategia de búsqueda
    de conjuntos de datos. Especificar las propiedades fundamentales de los datos, como las variables
    objetivo, los dominios de las características, los esquemas esperados, los límites de volumen y los
    parámetros temporales o geográficos, para centrar los esfuerzos de recopilación en los conjuntos de
    datos pertinentes. Indicar la distribución que deben presentar los datos para que cada caso que el
    sistema debe distinguir esté representado en cantidad suficiente, y acordar los rangos admisibles
    con un experto del dominio en lugar de inferirlos de la muestra que esté disponible.
  primaryStudies:
  - P10
  - P13
- id: A2
  title: Inventariar las fuentes de datos internas
  description: >-
    Descubrir y evaluar los activos de datos existentes distribuidos en los sistemas internos de la organización.
    Usar los catálogos de datos o repositorios de metadatos para evaluar las fuentes candidatas disponibles,
    fomentar la reutilización de activos e identificar carencias de datos internas, registrando para cada
    candidato su propietario, las reglas que rigen su uso y el nivel de control que exige su criticidad.
    Establecer qué acceso se concederá realmente al equipo, ya que los privilegios pueden variar dentro
    de un proyecto, e identificar dónde habrá que conciliar fuentes que registran los mismos hechos en
    formatos incompatibles.
  primaryStudies:
  - P3
  - P4
  - P11
  - P16
  - P17
- id: A3
  title: Identificar las fuentes de datos externas
  description: >-
    Descubrir conjuntos de datos complementarios en entornos externos, como registros públicos, portales
    de datos abiertos y proveedores comerciales. Buscar en repositorios públicos y portales de datos abiertos,
    considerar proveedores comerciales y considerar la generación de los datos mediante ensayos controlados
    o síntesis cuando no exista ninguna fuente adecuada. Realizar una evaluación formal de riesgos de
    cualquier proveedor antes de la adquisición que cubra su cadena de suministro, el preprocesamiento
    ya aplicado a los datos, sus prácticas de gobernanza y las políticas que lo vinculan. Obtener cualquier
    conjunto de datos preexistente de una fuente fiable por medios que garanticen su integridad durante
    la transferencia y, cuando los datos sean sintéticos, establecer que representan el dominio operativo
    previsto y no el comportamiento del generador.
  primaryStudies:
  - P3
  - P4
  - P8
  - P9
  - P16
  - P17
- id: A4
  title: Revisar las licencias de los datos
  description: >-
    Evaluar las condiciones de uso, las protecciones de derechos de autor y los acuerdos de distribución
    asociados a los conjuntos de datos candidatos. Comprobar las condiciones de licencia antes de la integración
    en el pipeline para que solo se incluyan conjuntos de datos que respeten los límites contractuales
    y los derechos de propiedad intelectual, y comprobar las condiciones que afectan a los datos en los
    que se basa un artefacto candidato además de las del propio artefacto.
  primaryStudies:
  - P10
  - P16
- id: A5
  title: Revisar los aspectos legales
  description: >-
    Evaluar los conjuntos de datos candidatos frente a la normativa de protección de datos y las políticas
    de privacidad aplicables. Verificar los mecanismos de consentimiento y la finalidad para la que se
    autorizó la recogida, y evaluar los riesgos de reidentificación, prestando especial atención al cruce
    con información auxiliar disponible en otros lugares. Registrar los derechos de acceso, la titularidad
    y las condiciones de conservación asociados a cada fuente.
  primaryStudies:
  - P3
  - P16
- id: A6
  title: Realizar una revisión ética
  description: >-
    Examinar los conjuntos de datos candidatos para detectar sesgos de representación, desequilibrios
    en las muestras y posibles daños sociales. Evaluar la cobertura demográfica y la diversidad contextual
    antes del entrenamiento y nombrar las categorías demográficas que deben cubrir los datos, para evitar
    que los modelos posteriores produzcan resultados injustos o discriminatorios.
  primaryStudies:
  - P3
  - P10
- id: A7
  title: Documentar las fuentes
  description: >-
    Registrar los metadatos sobre el origen del conjunto de datos, la estructura del esquema, los derechos
    de acceso y las limitaciones conocidas. Registrar estos detalles para dar soporte a la reproducibilidad
    y a la futura extracción y manipulación del conjunto de datos, incluida la licencia bajo la que se
    dispone de cada activo y la asociación entre un conjunto de datos y los experimentos y pipelines que
    lo han consumido.
  primaryStudies:
  - P3
  - P9
  - P10
  - P17
