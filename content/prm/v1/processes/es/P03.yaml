id: P03
number: 3
origin: standards-and-literature
name: Proceso de definición de requisitos del sistema
purpose: >-
  El propósito del *Proceso de definición de requisitos del sistema* es convertir las necesidades de las
  partes interesadas en un conjunto de requisitos del sistema verificables que describen lo que debe hacer
  el sistema de ML. Define el comportamiento funcional, las necesidades de datos, las interfaces y los
  objetivos de calidad para crear una línea base para el diseño y las pruebas.
outcomes:
- id: a
  text: Se definen requisitos del sistema coherentes y viables.
- id: b
  text: Se documentan los requisitos de funciones, datos, rendimiento e interfaces.
- id: c
  text: Se resuelven los conflictos y se establecen los objetivos de rendimiento.
- id: d
  text: >-
    Se establece la trazabilidad desde las necesidades de las partes interesadas hasta los requisitos
    del sistema y las etapas posteriores.
inputs:
- workProduct: stakeholder-requirements-specification
  name: Especificación de requisitos de las partes interesadas
  description: Los requisitos de las partes interesadas acordados y su contexto de uso.
  serves:
  - a
  - b
  - c
  - d
outputs:
- workProduct: system-requirements-specification
  name: Especificación de requisitos del sistema
  description: >-
    Los requisitos funcionales, de rendimiento, de calidad y de interfaz del sistema, con su trazabilidad.
  serves:
  - a
  - b
  - c
  - d
- workProduct: data-requirements-specification
  name: Especificación de requisitos de datos
  description: Los valores, formatos, calidad y metadatos esperados de los datos que necesita el sistema.
  serves:
  - a
  - b
activities:
- id: A1
  title: Revisar los requisitos de las partes interesadas
  description: >-
    Analizar los requisitos de las partes interesadas para encontrar sus implicaciones en los datos, los
    recursos y el entorno operativo, e identificar qué expectativas no pueden satisfacerse solo con una
    especificación determinista. Definir la estrategia con la que se identificarán, expresarán y gestionarán
    los requisitos del sistema según el modelo de ciclo de vida seleccionado, aceptando que parte del
    conjunto de requisitos solo se hará visible cuando exista un modelo inicial. Identificar los sistemas
    habilitadores y las herramientas necesarias para registrar y mantener los requisitos, ya que las plataformas
    de gestión de artefactos rara vez cubren esta actividad.
  primaryStudies:
  - P3
  - P10
  - P12
  - P13
  - P14
- id: A2
  title: Definir el comportamiento funcional
  description: >-
    Describir cómo el sistema recopila y procesa los datos, entrena los modelos y entrega las salidas,
    expresando el límite funcional en términos de las entradas que acepta y las respuestas que produce.
    Fijar pronto la especificación de salida de cada componente de aprendizaje automático para que el
    pipeline que lo rodea pueda diseñarse con independencia del desarrollo del modelo. Especificar el
    nivel de autonomía del sistema, indicando qué decisiones siguen en manos de un operador humano y qué
    umbrales puede ajustar ese operador, y definir las reglas deterministas de respaldo que se aplican
    cuando el modelo produce resultados inesperados o fuera de rango.
  primaryStudies:
  - P4
  - P8
  - P9
  - P18
- id: A3
  title: Identificar los requisitos de datos e información
  description: >-
    Especificar las fuentes de datos, el almacenamiento, el etiquetado y los criterios de calidad de los
    que depende el sistema, indicando el estado esperado de los datos mediante los valores admisibles
    de las características, los formatos aceptados y las proporciones toleradas de valores ausentes, con
    límites fijados para admitir observaciones reales plausibles y rechazar el resto. Expresar estas condiciones
    como un esquema para que los procesos posteriores puedan verificar con él los datos entrantes. Extender
    la especificación a los metadatos, cubriendo la propiedad, los derechos de acceso, la finalidad de
    uso y la conservación, y definir las estructuras de datos y los requisitos de integración necesarios
    para combinar las fuentes de forma coherente.
  primaryStudies:
  - P3
  - P8
  - P10
  - P12
  - P13
- id: A4
  title: Definir los requisitos de rendimiento y calidad
  description: >-
    Fijar objetivos medibles de exactitud, latencia, robustez y equidad, junto con las condiciones de
    entrada en las que se espera que se cumplan, e indicar las métricas con las que se evalúa cada uno
    en lugar de dejar su elección a procesos posteriores. Definir el margen de error aceptable y las clases
    de error con mayor impacto operativo. Complementar los objetivos predictivos con atributos de calidad
    como la explicabilidad, la escalabilidad y la complejidad del modelo, y con restricciones de recursos
    que cubran el hardware de inferencia, el presupuesto computacional y la infraestructura que requiere
    el sistema desplegado.
  primaryStudies:
  - P1
  - P3
  - P4
  - P6
  - P8
  - P10
  - P11
  - P13
- id: A5
  title: Definir los requisitos de interfaz
  description: >-
    Identificar cómo interactúa el sistema con las API, los usuarios y otros componentes, especificando
    los flujos de datos que conectan los componentes de aprendizaje automático con los módulos de software
    convencionales y el formato en que se exponen las predicciones. Indicar las propiedades no funcionales
    que se esperan de la interfaz de servicio, incluidas la disponibilidad, el control de acceso, el registro
    y la auditabilidad, de modo que el código de entrenamiento y el de servicio se desarrollen a partir
    de una especificación compartida. Tener en cuenta las interacciones entre los componentes de aprendizaje
    automático, cuyo entrelazamiento puede propagar errores por todo el sistema cuando se tratan como
    piezas sustituibles de forma independiente.
  primaryStudies:
  - P1
  - P2
  - P4
  - P10
- id: A6
  title: Analizar y refinar los requisitos
  description: >-
    Comprobar la coherencia, la viabilidad y la verificabilidad de los requisitos, resolviendo los conflictos
    y los compromisos entre la calidad predictiva y el resto de atributos de calidad antes de que avance
    el desarrollo. Considerar riesgos como la deriva de datos, el cambio de distribución y la divergencia
    entre las condiciones de entrenamiento y las de operación, y confirmar que la especificación sigue
    siendo alcanzable en esas condiciones. Planificar un refinamiento controlado del conjunto de requisitos
    a medida que los requisitos de datos y de modelo se aclaren durante el desarrollo, de modo que los
    cambios descubiertos durante el tratamiento de los datos se registren en lugar de absorberse de manera
    informal.
  primaryStudies:
  - P7
  - P8
  - P11
  - P12
- id: A7
  title: Establecer la trazabilidad
  description: >-
    Crear vínculos bidireccionales entre las necesidades de las partes interesadas y los requisitos del
    sistema, extendiéndolos a los conjuntos de datos, las versiones del modelo y los métodos de verificación
    con los que se demostrará cada requisito. Registrar la justificación de las decisiones sobre los requisitos
    y obtener un acuerdo explícito sobre la línea base resultante. Como el flujo de trabajo de aprendizaje
    automático no ofrece una descomposición jerárquica formal de los requisitos y las herramientas disponibles
    apenas dan soporte a esta actividad, establecer la trazabilidad como un acuerdo explícito del proyecto
    respaldado por registros de procedencia, en lugar de suponer que la proporciona la infraestructura
    de desarrollo.
  primaryStudies:
  - P5
  - P8
  - P9
