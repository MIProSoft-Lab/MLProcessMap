id: P24
number: 24
origin: standards-and-literature
name: Procés de manteniment
purpose: >-
  El propòsit del *Procés de manteniment* és mantenir la capacitat del sistema d'aprenentatge automàtic per
  prestar el seu servei. Analitza les desviacions notificades i duu a terme les accions correctives, adaptatives,
  perfectives i preventives necessàries, inclòs el reentrenament, coordinant la feina amb els processos de dades,
  de model i de transició.
outcomes:
- id: a
  text: Es defineix una estratègia de manteniment com a annex de la documentació de l'arquitectura.
- id: b
  text: >-
    Les necessitats de manteniment es classifiquen i s'atribueixen a les dades, al model o al codi.
- id: c
  text: S'avalua l'impacte de cada canvi abans de la seva implementació.
- id: d
  text: >-
    Es restableix la capacitat operacional després d'una fallada mitjançant la reversió, la reserva o l'operació
    degradada.
- id: e
  text: >-
    S'implementen els canvis, inclòs el reentrenament o l'aprenentatge continu del model.
- id: f
  text: >-
    Es fan proves de regressió dels canvis i els models revisats s'avaluen amb el marc d'avaluació original.
- id: g
  text: >-
    Es confirma la capacitat restablerta respecte dels indicadors que varen desencadenar el canvi.
- id: h
  text: >-
    S'estableixen registres i tendències de manteniment que vinculen cada acció amb els elements afectats i amb
    el llinatge del model.
inputs:
- workProduct: maintenance-requests
  name: Sol·licituds de manteniment
  description: Els problemes escalats des de l'operació que requereixen un canvi.
  serves:
  - b
  - c
- workProduct: monitoring-record
  name: Registre de monitoratge
  description: Les evidències de deriva i de rendiment.
  serves:
  - b
  - g
- workProduct: integrated-system
  name: Sistema integrat
  description: El sistema la capacitat del qual es manté.
  serves:
  - c
  - d
  - e
- workProduct: system-architecture-documentation
  name: Documentació de l'arquitectura del sistema
  description: Els desencadenants de reentrenament, els punts de control de validació i els mecanismes de reversió.
  serves:
  - a
  - d
- workProduct: disaster-recovery-plan
  name: Pla de recuperació davant desastres
  description: >-
    Les estratègies de còpia de seguretat, els objectius de recuperació i els procediments de recuperació dels
