id: P19
number: 19
origin: standards-only
name: Procés de verificació del sistema
purpose: >-
  El propòsit del *Procés de verificació del sistema* és proporcionar evidències objectives que el sistema
  d'aprenentatge automàtic integrat compleix els requisits i el disseny especificats abans de la seva transició a
  l'operació. Comprova la correcció de la implementació, les interaccions entre els components d'aprenentatge
  automàtic i el sistema de programari més ampli, i el comportament del sistema sota càrrega i davant fallades.
outcomes:
- id: a
  text: >-
    Es defineix una estratègia de verificació, amb el seu abast, els mètodes, els criteris d'èxit i l'entorn.
- id: b
  text: Es verifica el funcionament correcte dels fluxos de treball funcionals i de les interfícies.
- id: c
  text: Es verifica el rendiment en execució respecte dels objectius de nivell de servei.
- id: d
  text: Es verifiquen els mecanismes de tolerància a fallades, de reserva, de reversió i de recuperació.
- id: e
  text: >-
    Es verifica la seguretat del sistema respecte dels seus requisits de seguretat, incloses les vulnerabilitats
    pròpies de l'aprenentatge automàtic.
- id: f
  text: >-
    Es verifica que l'entorn i les dependències estan identificats, controlats i són reproduïbles.
- id: g
  text: S'estableix la preparació operacional del monitoratge i del versionat.
- id: h
  text: >-
    Les activitats i els resultats de la verificació es documenten a l'Informe de verificació del sistema.
- id: i
  text: >-
    Les no conformitats es registren per a l'acció correctiva i es tracen fins als requisits.
