id: P22
number: 22
origin: standards-and-literature
name: Proceso de validación continua
purpose: >-
  El propósito del *Proceso de validación continua* es hacer el seguimiento de los datos de entrada y de las
  salidas del modelo después del despliegue para detectar problemas pronto. Al monitorizar las métricas
  pertinentes en producción, ayuda a identificar problemas como la deriva de los datos o la degradación del
  rendimiento antes de que provoquen fallos.
outcomes:
- id: a
  text: Se monitorizan los datos de producción para detectar derivas, cambios de esquema y anomalías.
- id: b
  text: >-
    Se evalúa el comportamiento del modelo mediante el seguimiento del rendimiento y de las desviaciones
    estadísticas.
- id: c
  text: Se analizan la confianza y la incertidumbre del modelo para detectar su degradación.
- id: d
  text: Se hace el seguimiento de las métricas operativas, como la latencia y el uso de recursos.
- id: e
  text: Se configuran mecanismos de alerta para notificar las desviaciones a las partes interesadas.
- id: f
  text: >-
    Se elabora un Registro de monitorización que documenta los indicadores, las alertas y los procedimientos
    de respuesta.
inputs:
- workProduct: live-model-outputs
  name: Salidas del modelo en producción
  description: Las predicciones sobre datos reales, registradas junto con sus entradas.
  serves:
  - a
  - b
  - c
  - d
- workProduct: evaluation-framework
  name: Marco de evaluación
  description: >-
    Las métricas de datos, de modelo, de entrenamiento y de coste, las líneas base y los benchmarks que se
    usan en la evaluación.
  serves:
  - a
  - b
  - e
- workProduct: architecture-requirements-specification
  name: Especificación de requisitos de arquitectura
  description: >-
    Los requisitos de interfaz y los indicadores y objetivos de nivel de servicio que la arquitectura debe
    soportar.
  serves:
  - d
  - e
- workProduct: system-validation-report
  name: Informe de validación del sistema
  description: Los resultados obtenidos en condiciones de operación y la decisión de aceptación.
  serves:
  - b
outputs:
- workProduct: monitoring-record
  name: Registro de monitorización
  description: Los indicadores supervisados, las observaciones, los incidentes y las responsabilidades.
  serves:
