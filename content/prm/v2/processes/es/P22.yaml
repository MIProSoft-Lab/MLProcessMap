activities:
- id: A1
  title: Monitorizar los datos de entrada
  description: >-
    Comparar los datos recibidos en producción con los datos con los que se entrenó el modelo y con los datos
    de producción anteriores, usando las métricas de datos definidas en el Marco de evaluación, para detectar
    derivas en sus distribuciones, deterioros en su calidad y cambios en su estructura o su significado.
    Monitorizar las fuentes y los sistemas que suministran los datos, de modo que se detecten sus cambios,
    fallos o envejecimiento aunque no produzcan ninguna anomalía evidente en los valores. Seleccionar métodos
    de comparación adecuados al volumen y la dimensionalidad de los datos, y considerar que los cambios
    también pueden deberse al uso del modelo fuera de su finalidad prevista o a la reacción de los usuarios
    ante sus salidas.
  primaryStudies:
  - P8
  - P10
  - P13
  - P17
  - P18
- id: A2
  title: Monitorizar el comportamiento del modelo
  description: >-
    Hacer el seguimiento del rendimiento del modelo en producción frente a las métricas definidas en el Marco
    de evaluación, tomando como referencia el rendimiento observado durante la validación del sistema,
    midiéndolo directamente cuando se disponga de los valores reales e infiriéndolo de la distribución de sus
    salidas cuando no. Monitorizar los demás requisitos que se espera que cambien con el tiempo, como la
    equidad, la transparencia, la privacidad y el tiempo de ejecución, junto con indicadores operativos,
    comparados con los objetivos de nivel de servicio de la Especificación de requisitos de arquitectura, que
    confirmen que el modelo funciona y consume recursos según lo previsto. Distinguir la degradación gradual
    causada por el cambio de los datos de la pérdida de validez causada por cambios en el propio problema, y
    considerar la antigüedad del modelo y los efectos de las actualizaciones anteriores como indicadores en sí
    mismos.
  primaryStudies:
  - P3
  - P8
  - P10
  - P11
  - P13
  - P16
  literature:
  - sculleyHiddenTechnicalDebt2015
- id: A3
  title: Configurar las alertas
  description: >-
    Definir para cada indicador monitorizado los umbrales, derivándolos de los objetivos de nivel de servicio
    cuando existan, la frecuencia de evaluación y la respuesta esperada, equilibrando la detección de
    problemas reales con el número de alertas que no dan lugar a ninguna acción. Formular las alertas de modo
    que transmitan el alcance y el efecto probable de la desviación, priorizar las que afectan a los elementos
    de los que depende el servicio y asociar a cada una las acciones que deben realizarse. Configurar las
    respuestas automatizadas autorizadas por la estrategia de mantenimiento, como las barreras de protección
    sobre las salidas o el cambio a un modelo alternativo, y dirigir al proceso de mantenimiento las alertas
    que requieran una decisión sobre el modelo. Revisar la configuración cada vez que se actualice el modelo.
  primaryStudies:
  - P6
  - P14
  - P17
  literature:
  - breckMLTestScore2017
  - sculleyHiddenTechnicalDebt2015
- id: A4
  title: Documentar la monitorización
  description: >-
    Registrar en el Registro de monitorización los indicadores supervisados, las reglas de alerta y la
    justificación de cada umbral, las observaciones y los resultados de validación a lo largo del tiempo, y
    las personas responsables de responder a cada alerta. Vincular cada observación con la versión del modelo
    que estaba en servicio cuando se hizo, de modo que pueda relacionarse con el linaje del modelo que
    mantiene el proceso de mantenimiento. Mantener el registro coherente entre los sistemas de la
    organización, para que la monitorización de distintos modelos siga siendo comparable.
  primaryStudies:
  - P10
  - P14
  - P17
