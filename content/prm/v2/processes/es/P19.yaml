id: P19
number: 19
origin: standards-only
name: Proceso de verificación del sistema
purpose: >-
  El propósito del *Proceso de verificación del sistema* es proporcionar evidencias objetivas de que el
  sistema de aprendizaje automático integrado cumple sus requisitos y su diseño especificados antes de su
  transición a operación. Comprueba la corrección de la implementación, las interacciones entre los
  componentes de aprendizaje automático y el sistema software más amplio y el comportamiento del sistema bajo
  carga y ante fallos.
outcomes:
- id: a
  text: >-
    Se define una estrategia de verificación, con su alcance, sus métodos, sus criterios de éxito y su entorno.
- id: b
  text: Se verifica el funcionamiento correcto de los flujos de trabajo funcionales y de las interfaces.
- id: c
  text: Se verifica el rendimiento en ejecución frente a los objetivos de nivel de servicio.
- id: d
  text: Se verifican los mecanismos de tolerancia a fallos, respaldo, reversión y recuperación.
- id: e
  text: >-
    Se verifica la seguridad del sistema frente a sus requisitos de seguridad, incluidas las vulnerabilidades
    propias del aprendizaje automático.
- id: f
  text: Se verifica que el entorno y las dependencias están identificados, controlados y son reproducibles.
- id: g
  text: Se establece la preparación operativa de la monitorización y del versionado.
- id: h
  text: >-
    Se documentan las actividades y los resultados de la verificación en el Informe de verificación del
    sistema.
- id: i
  text: Se registran las no conformidades para su corrección y se trazan hasta los requisitos.
