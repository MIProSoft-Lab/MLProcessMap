activities:
- id: A1
  title: Preparar la verificación
  description: >-
    Definir la estrategia y el alcance de la verificación a partir de la Especificación de requisitos del
    sistema, la Especificación de requisitos de arquitectura y la Línea base del diseño, identificando para
    cada requisito el método de verificación y el resultado esperado, así como las restricciones que limitan
    lo que puede verificarse. Seleccionar un entorno controlado lo más parecido posible al operativo, sin
    interferir con él, e identificar las entradas reales o sintéticas que se usarán, asegurando que las
    entradas sintéticas que pretenden representar la operación normal son creíbles. Automatizar los
    procedimientos de verificación siempre que sea posible, para que puedan repetirse cada vez que cambien el
    modelo, los datos o el código, y prever la revisión de los datos de prueba a medida que evolucionen el
    modelo y sus condiciones de operación.
- id: A2
  title: Verificar el comportamiento funcional y las interfaces
  description: >-
    Probar los flujos de trabajo de extremo a extremo para confirmar que las predicciones se procesan e
    interpretan correctamente, comprobando el cumplimiento de cada requisito del sistema y probando las
    interfaces entre el modelo y las API, las bases de datos y los módulos con los que intercambia datos
    frente a la Línea base del diseño. Confirmar que el modelo acepta las entradas válidas, rechaza o trata
    las no válidas sin fallar y devuelve las salidas en la forma esperada. Ejecutar una prueba automatizada
    que recorra todo el pipeline, confirmar que el entrenamiento y el servicio calculan los mismos valores de
    las características y que el preprocesamiento y el posprocesamiento entregan los datos en la forma
    esperada, hacer pruebas unitarias del código de especificación del modelo y de preparación de datos, y
    revisar el código escrito para el sistema de aprendizaje automático. Cuando la salida esperada para una
    entrada dada no pueda determinarse de antemano, usar relaciones que deban cumplirse entre las salidas de
    entradas relacionadas.
- id: A3
  title: Verificar el rendimiento
  description: >-
    Evaluar si el sistema cumple los objetivos de nivel de servicio definidos en la Especificación de
    requisitos de arquitectura, como la latencia y el rendimiento, con la carga esperada y en condiciones de
    estrés, en el hardware en el que se ejecutará. Medir el consumo de recursos y confirmar que se mantiene
    dentro de la línea base de coste técnico, y comparar la latencia, el rendimiento y el uso de memoria entre
    versiones del código, los datos y el modelo para detectar regresiones tanto repentinas como graduales.
  primaryStudies:
  - P8
  - P13
  literature:
  - breckMLTestScore2017
- id: A4
  title: Verificar la tolerancia a fallos y la recuperación
  description: >-
    Simular los escenarios de fallo relevantes para el sistema, como fuentes de datos no disponibles o
    corruptas, inferencia no disponible, picos de latencia y entradas no válidas o extremas resultantes de
    fallos en otras partes del sistema, para confirmar que los procedimientos de respaldo se activan
    correctamente, que el sistema se degrada de forma controlada y que cualquier mecanismo que limite las
    salidas del modelo se mantiene cuando el modelo se comporta mal. Verificar que la reversión a una versión
    anterior del modelo se activa en las condiciones definidas para ello y se completa en el tiempo previsto,
    y que el modelo restaurado sigue siendo compatible con los datos, las características y los componentes de
    los que depende. Confirmar que los procedimientos de recuperación del Plan de recuperación ante desastres
    pueden llevarse a cabo y que están documentados de modo que no dependan del conocimiento de personas
    concretas.
- id: A5
  title: Verificar la seguridad
  description: >-
    Analizar las vulnerabilidades del sistema integrado y realizar pruebas de penetración, y probarlo frente a
    los ataques propios del aprendizaje automático identificados en los requisitos de seguridad, como las
    entradas manipuladas para cambiar sus predicciones, los intentos de extraer el modelo o de reconstruir sus
    datos de entrenamiento y el envenenamiento de los datos recopilados para el reentrenamiento. Confirmar que
    el acceso al modelo, a sus predicciones y a sus datos de entrenamiento está restringido según lo
    especificado.
- id: A6
  title: Verificar el entorno y las dependencias
  description: >-
    Verificar que el sistema se comporta de forma coherente cuando se despliega en entornos limpios y
    reproducibles distintos de aquel en el que se desarrolló. Confirmar que sus bibliotecas, plataformas y
    configuraciones están identificadas, controladas y aprobadas según la política de la organización, y que
    sus cambios pueden distinguirse de los cambios en el propio modelo. Extender estas comprobaciones a las
    dependencias de datos del sistema, identificando las señales externas de las que depende el modelo y
    confirmando que sus versiones están controladas.
- id: A7
  title: Verificar la preparación operativa
  description: >-
    Comprobar que la monitorización, las alertas y el control de versiones están configurados correctamente.
    Confirmar que la telemetría, los paneles de control, el control de acceso, el registro y la auditabilidad
    están implantados, y que cada modelo desplegado puede identificarse junto con los datos usados para
    construirlo y probarlo.
  literature:
  - ISO5338
- id: A8
  title: Documentar los resultados de la verificación
  description: >-
    Registrar en el Informe de verificación del sistema la estrategia de verificación, las pruebas realizadas,
    sus resultados, las anomalías encontradas y las limitaciones y supuestos de la verificación, usando las
    Plantillas de informe para que las verificaciones sucesivas sigan siendo comparables. Describir cada no
    conformidad con información suficiente para que el proceso en el que se originó pueda abordarla, hacer el
    seguimiento de su resolución, confirmar que se han cumplido los criterios de verificación y mantener la
    trazabilidad entre los resultados de la verificación y los requisitos y elementos de diseño a los que se
    refieren.
  literature:
  - ISO12207
