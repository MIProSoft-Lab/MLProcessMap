id: reference-sequence
name: Secuencia de referencia (ejemplo)
status: draft
prmVersion: v2
description: >-
  Una disposición de ejemplo de los procesos del PRM en el orden de la topología, con las fases de
  preparación de los datos y de modelado repetidas hasta que el modelo cumple sus criterios de éxito.
  Muestra cómo se define una plantilla de ciclo de vida; no es uno de los modelos de ciclo de vida de la
  revisión de la literatura.
phases:
  - id: problem
    name: Problema y requisitos
    processes: [P01, P02, P03, P07]
  - id: architecture
    name: Arquitectura y diseño
    processes: [P04, P05, P06]
  - id: data
    name: Preparación de los datos
    processes: [P08, P09, P10, P11, P12, P13]
    iterative: true
  - id: modeling
    name: Modelado
    processes: [P14, P15, P16, P17]
    iterative: true
    returnsTo: data
    returnNote: Cuando el modelo no cumple sus criterios de éxito, volver a la preparación de los datos.
  - id: deployment
    name: Integración y despliegue
    processes: [P18, P19, P20, P21]
  - id: operation
    name: Operación
    processes: [P22, P23, P24, P25]
    iterative: true
    returnsTo: data
    returnNote: La validación continua detecta la deriva y desencadena el reentrenamiento con datos nuevos.
